
<svg id="uchiha" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">

  <defs>
    <!-- curved divider pushed further down -->
    <clipPath id="bottomCurve">
      <path d="
        M0,75
        Q50,55 100,75
        L100,100
        L0,100
        Z"/>
    </clipPath>
  </defs>

  <!-- red moon shape -->
  <path d="M 5 50 a 45 45 0 1 0 90 0 a 45 45 0 1 0 -90 0 Z"
        fill="red"/>

  <!-- white curved bottom -->
  <g clip-path="url(#bottomCurve)">
    <path d="M 5 50 a 45 45 0 1 0 90 0 a 45 45 0 1 0 -90 0 Z"
          fill="white"/>
  </g>

  <!-- longer rectangle handle -->
  <rect x="37" y="88" width="22" height="30" fill="white"/>

</svg>

