<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Joel Michael George</title>

  <link rel="icon" type="image/png" href="images/favicon.png" />

  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/phone.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    .login-container{
      min-height:100vh;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      box-sizing:border-box;
    }

    .login-card{
      width:420px;
      max-width:95%;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:25px;
      padding:45px 35px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.35);
    }

    .login-card h1{
      font-size:2.3rem;
      margin-bottom:10px;
      color:white;
    }

    .login-card p{
      color:#ddd;
      margin-bottom:35px;
      font-size:1rem;
    }

    .google-btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:16px;
      font-size:1rem;
      font-weight:600;
      font-family:'Poppins', sans-serif;
      cursor:pointer;
      transition:0.3s;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      background:white;
      color:black;
    }

    .google-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .google-btn img{
      width:24px;
      height:24px;
    }

    .mini-text{
      margin-top:25px;
      font-size:0.9rem;
      color:#bbb;
    }

  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <h1>Welcome Back</h1>

      <p>
        Sign in to access all projects in my ecosystem
      </p>

      <button class="google-btn" id="googleLogin">

        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
        />

        Continue with Google

      </button>

      <div class="mini-text">
        One login for all apps
      </div>

    </div>

  </div>

  <script type="module">

import {
  googleLogin
}
from "./shared/auth.js";

document
  .getElementById("googleLogin")
  .addEventListener("click", googleLogin);

// background logic
const now = new Date();
const body = document.body;

const isDay = now.getHours() >= 6 && now.getHours() < 18;

function setBackground() {
  let selectedImage;

  if (isDay) {
    selectedImage = Math.floor(Math.random() * 7) + 1;
    body.style.backgroundImage =
      `url('images/day/day(${selectedImage}).png')`;
  } else {
    selectedImage = Math.floor(Math.random() * 7) + 1;
    body.style.backgroundImage =
      `url('images/night/night(${selectedImage}).png')`;
  }
}

setBackground();
</script>

</body>
</html>
