    <script>
        document.getElementById("header").addEventListener("click", () => {
            const next = document.querySelector(".project-wrapper");
            if (next) {
                next.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        });
        const now = new Date();
        const body = document.body;
        if (now.getHours() >= 6 && now.getHours() < 18) {
            const selectedImage = Math.floor(Math.random() * 6) + 1;
            body.style.backgroundImage = `url('images/day/day(${selectedImage}).png')`;
        } else {
            const selectedImage = Math.floor(Math.random() * 7) + 1;
            body.style.backgroundImage = `url('images/night/night(${selectedImage}).jpg')`;
        }
    </script>
