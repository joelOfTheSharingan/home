    <script type="module">
import {supabase,getUser,logout,googleLogin,googleSignup} from "./shared/auth.js";

// ─────────────────────────────
// Random quote feature
// ─────────────────────────────

async function loadQuotes() {
  try {
    const res = await fetch("./qoutes.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.warn("Could not load quotes:", e);
    return [];
  }
}

function renderQuote(quotes) {
  if (!quotes || quotes.length === 0) return;
  const random = quotes[Math.floor(Math.random() * quotes.length)];
  const el = document.getElementById("qoute");
  if (!el) return;
  if (typeof random === "string") {
    el.textContent = `"${random}"`;
    return;
  }
  const text = (random.quote || random.text || random.content || "").trim();
  const author = random.author ? ` — ${random.author}` : "";
  el.textContent = text ? `"${text}"${author}` : "";
}

async function initQuote() {
  const quotes = await loadQuotes();
  renderQuote(quotes);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initQuote);
} else {
  initQuote();
}
</script>

<script type="module">
import {supabase,getUser,logout,googleLogin,googleSignup} from "./shared/auth.js";
/* ─────────────────────────────
   1. REMOVE ACCESS TOKEN HASH
───────────────────────────── */

if (window.location.hash.includes("access_token")) {

  // let Supabase store session
  await supabase.auth.getSession();

  // clean URL
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}

/* ─────────────────────────────
   2. WAIT FOR SESSION RESTORE
───────────────────────────── */

await new Promise(resolve =>
  setTimeout(resolve, 1000)
);

/* ─────────────────────────────
   3. GET SESSION
───────────────────────────── */

const {
  data: { session }
} = await supabase.auth.getSession();

/* ─────────────────────────────
   4. REDIRECT IF NOT LOGGED IN
───────────────────────────── */

if (!session) {
    const userBox = document.getElementById("userBox");
    if (userBox) {
      userBox.innerHTML =
        '<img id="userAvatar" src="images/default-avatar.png" alt="Guest" /><span id="username">Imposter</span>';
      userBox.classList.add('guest-mode');
    }
  } else {
    const userBox = document.getElementById("userBox");
    if (userBox) userBox.classList.remove('guest-mode');
  }

/* ─────────────────────────────
   5. GET USER
───────────────────────────── */

const {
  data: { user }
} = await supabase.auth.getUser();

console.log(user);

/* ─────────────────────────────
   6. USERNAME
───────────────────────────── */

if (session) {
  document.getElementById("username").textContent =
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email ||
    "User";

  /* ─────────────────────────────
     7. AVATAR
───────────────────────────── */

  const avatar =
    document.getElementById("userAvatar");

  avatar.src =
    user?.user_metadata?.avatar_url ||
    "images/default-avatar.png";

  avatar.alt = "User Avatar";

  avatar.onerror = () => {

    avatar.src =
      "images/default-avatar.png";
  };
}

/* ─────────────────────────────
   8. LOGOUT
───────────────────────────── */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await logout();

    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    window.location.href = isLocal
      ? "/home/login.html"
      : "https://joelofthesharingan.github.io/home/login.html";
  });

const logoutButton = document.getElementById("logoutBtn");
const panel = document.getElementById("user-panel");

panel.addEventListener("mouseenter", () => {
  logoutButton.style.left = "50px";
});

panel.addEventListener("mouseleave", () => {
  logoutButton.style.left = "170px";
});

// Default is Login (logout hidden via inline style). Only show logout after session confirmed.
// Header: Guest (left) opposite Login (right) when logged out; real user (left) opposite Logout (right) when logged in.
if (!session) {
  logoutButton.style.display = "none";
  document.getElementById("login-panel").style.display = "flex";
  document.getElementById("userBox").style.display = "flex";
} else {
  logoutButton.style.display = "flex";
  document.getElementById("login-panel").style.display = "none";
  document.getElementById("userBox").style.display = "flex";
}

/* ─────────────────────────────
   9. LOGIN BUTTON
───────────────────────────── */
document
  .getElementById("loginBtn")
  .addEventListener("click", googleLogin);

</script>
<script>
/* ===== MOBILE REEL — uniform feed (mobile only via phone.css) =====
 * Generates identical .mobile-reel-card divs for BOTH software + hardware
 * into a single #mobile-projects-reel container — like instagram reels.
 * Desktop view is untouched (hidden by @media in styles.css / phone.css).
 */
(function () {
  var HARDWARE = [
    { name: 'JARVIS',       desc: 'AI Voice Assistant',      img: 'images/jarvis.png',    href: '/redirect?app=jarvis' },
    { name: 'RC Plane',     desc: 'Remote Control Aircraft', img: 'images/rc-plane.png',  href: '/redirect?app=rcPlane' },
    { name: 'ESP32 Farm',   desc: 'IoT Smart Farm',          img: 'images/esp32-farm.png',href: '/redirect?app=esp32Farm' },
    { name: 'Soil Moisture',desc: 'Soil Moisture Sensor',    img: 'images/moisture.png',  href: '/redirect?app=soilMoisture' }
  ];

  var LIVIT_SVG = '<svg class="project-icon livit-svg" viewBox="-2 -20 40 44" xmlns="http://www.w3.org/2000/svg"><path d="M -1 1 L 20 23 L 24 19 L 7 1 L 24 -16 L 20 -20 Z" fill="#E53935"/><path d="M 11 1 L 26 -14 L 30 -10 L 25 -5 L 37 7 L 33 11 L 21 -1 L 19 1 L 31 13 L 27 17 Z" fill="#E53935"/></svg>';

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function cardHTML(opts) {
    var icon = opts.svg
      ? LIVIT_SVG
      : (opts.img ? '<img src="' + esc(opts.img) + '" class="project-icon" alt="' + esc(opts.name) + '" loading="lazy">' : '');
    return (
      '<div class="mobile-reel-card">' +
        '<span class="reel-card-badge">' + esc(opts.badge) + '</span>' +
        icon +
        '<div class="reel-card-name">' + esc(opts.name) + '</div>' +
        '<div class="reel-card-desc">' + esc(opts.desc) + '</div>' +
        '<a href="' + esc(opts.href) + '" class="reel-card-link">Launch <img src="images/icons/launch.png" alt=""></a>' +
      '</div>'
    );
  }

  function render(softwareCards) {
    var reel = document.getElementById('mobile-projects-reel');
    if (!reel) return;
    var html = '';
    (softwareCards || []).forEach(function (p) {
      html += cardHTML({
        name: p.name,
        desc: p.description,
        img: p.img,
        svg: p.svg === true,
        href: '/redirect?app=' + encodeURIComponent(String(p.name).toLowerCase()),
        badge: 'Software'
      });
    });
    HARDWARE.forEach(function (h) {
      html += cardHTML({
        name: h.name,
        desc: h.desc,
        img: h.img,
        svg: false,
        href: h.href,
        badge: 'Hardware'
      });
    });
    reel.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', function () {
    fetch('projects.json')
      .then(function (r) { if (!r.ok) throw new Error('fetch failed'); return r.json(); })
      .then(function (data) { render((data && data.cards) || []); })
      .catch(function () { render([]); });
  });

  // Arrow (↓) → scroll to first card on mobile, desktop unchanged visually
  document.addEventListener('DOMContentLoaded', function () {
    var arrow = document.getElementById('arrow');
    if (!arrow) return;
    arrow.setAttribute('role', 'button');
    arrow.setAttribute('tabindex', '0');
    arrow.setAttribute('aria-label', 'Scroll to projects');
    function goToFirstCard() {
      // mobile — center first card in viewport, accounting for fixed 56px bar
      if (window.matchMedia('(max-width: 768px)').matches) {
        var first = document.querySelector('#mobile-projects-reel .mobile-reel-card');
        if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' }); return; }
        var reel = document.getElementById('mobile-projects-reel');
        if (reel) { reel.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      }
      // desktop — carousel container
      var desktop = document.getElementById('all-projects-container') || document.getElementById('hardware-projects');
      if (desktop) desktop.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    arrow.addEventListener('click', goToFirstCard);
    arrow.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToFirstCard(); }
    });
  });
})();
</script>

<script>
  (function () {
    function dismissLoader() {
      setTimeout(function () { document.body.classList.add('is-loaded'); }, 1500);
    }
    if (document.readyState === 'complete') dismissLoader();
    else window.addEventListener('load', dismissLoader);
    // safety: never block longer than 4s
    setTimeout(function () { document.body.classList.add('is-loaded'); }, 4000);
  })();
</script>
