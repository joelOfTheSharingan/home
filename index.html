    <script>
        document.getElementById("header").addEventListener("click", () => {
            const next = document.querySelector(".project-wrapper");
            if (next) {
                next.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        });
        const now = new Date();
        const body = document.body;
        if (now.getHours() >= 6 && now.getHours() < 18) {
            const selectedImage = Math.floor(Math.random() * 6) + 1;
            body.style.backgroundImage = `url('images/day/day(${selectedImage}).png')`;
        } else {
            const selectedImage = Math.floor(Math.random() * 6) + 1;
            body.style.backgroundImage = `url('images/night/night(${selectedImage}).jpg')`;
        }
    </script>

    <script type="module">
import {supabase,getUser,logout} from "./shared/auth.js";
/* ─────────────────────────────
   1. REMOVE ACCESS TOKEN HASH
───────────────────────────── */

if (window.location.hash.includes("access_token")) {

  // let Supabase store session
  await supabase.auth.getSession();

  // clean URL
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}

/* ─────────────────────────────
   2. WAIT FOR SESSION RESTORE
───────────────────────────── */

await new Promise(resolve =>
  setTimeout(resolve, 1000)
);

/* ─────────────────────────────
   3. GET SESSION
───────────────────────────── */

const {
  data: { session }
} = await supabase.auth.getSession();

/* ─────────────────────────────
   4. REDIRECT IF NOT LOGGED IN
───────────────────────────── */

if (!session) {

  const isLocal =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1";

  window.location.href = isLocal
    ? "/home/login.html"
    : "https://joelofthesharingan.github.io/home/login.html";
}

/* ─────────────────────────────
   5. GET USER
───────────────────────────── */

const {
  data: { user }
} = await supabase.auth.getUser();

console.log(user);

/* ─────────────────────────────
   6. USERNAME
───────────────────────────── */

document.getElementById("username").textContent =

  user?.user_metadata?.full_name ||
  user?.user_metadata?.name ||
  user?.email ||
  "User";

/* ─────────────────────────────
   7. AVATAR
───────────────────────────── */

const avatar =
  document.getElementById("userAvatar");

avatar.src =

  user?.user_metadata?.avatar_url ||
  "images/default-avatar.png";

avatar.alt = "User Avatar";

avatar.onerror = () => {

  avatar.src =
    "images/default-avatar.png";
};

/* ─────────────────────────────
   8. LOGOUT
───────────────────────────── */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await logout();

    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    window.location.href = isLocal
      ? "/home/login.html"
      : "https://joelofthesharingan.github.io/home/login.html";
  });

</script>
