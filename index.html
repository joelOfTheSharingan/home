  const userPanel = document.getElementById("user-panel");

userPanel.addEventListener("mouseenter", () => {
  document.getElementById("logoutBtn").style.transform = "translateX(-110px)";
});
userPanel.addEventListener("mouseleave", () => {
  document.getElementById("logoutBtn").style.transform = "translateX(0px)";
});

let sharinganStarted = false;

function activateSharingan() {

    if (sharinganStarted) return;
    sharinganStarted = true;

    const containers =
      document.querySelectorAll(".eye-and-reflection-container");

    let current = 0;

    const effect =
      document.getElementById("sharingan-effect");

    effect.style.display = "flex";

    containers[current].classList.add("active");

    setInterval(() => {

      const oldEye = containers[current];

      oldEye.classList.remove("active");
      oldEye.classList.add("exit");

      current =
        (current + 1) % containers.length;

      const nextEye = containers[current];

      nextEye.classList.add("active");

      setTimeout(() => {
        oldEye.classList.remove("exit");
      }, 1200);

    }, 1800);

    setTimeout(() => {
      window.location.href =
        "games/expanded-chroma.html";
    }, 11000);

  }

  
</script>

    <script>
/* ==========================================================
   BACKGROUND SYSTEM
   ========================================================== */

/* -------------------------
   1. ELEMENTS
------------------------- */

const body = document.body;

const toggle =
  document.querySelector(".theme-switch__checkbox");

/* -------------------------
   2. AUTO DAY / NIGHT
------------------------- */

const now = new Date();

let isNight =
  !(now.getHours() >= 6 && now.getHours() < 18);

toggle.checked = isNight;

/* -------------------------
   3. IMAGE ARRAYS
------------------------- */

const nightImages = [
  "images/night/night(1).png",
  "images/night/night(2).png",
  "images/night/night(3).png",
  "images/night/night(4).png",
  "images/night/night(5).png",
  "images/night/night(6).png",
  "images/night/night(7).png"
];

const dayImages = [
  "images/day/day(1).png",
  "images/day/day(2).png",
  "images/day/day(3).png",
  "images/day/day(4).png",
  "images/day/day(5).png"
];

/* -------------------------
   4. GET CURRENT IMAGE SET
------------------------- */

function getCurrentImages() {

  return isNight
    ? nightImages
    : dayImages;

}

/* -------------------------
   5. APPLY BACKGROUND
------------------------- */

function applyBackground(imagePath) {

  body.style.backgroundImage =
    `url("${imagePath}")`;

}

/* -------------------------
   6. RANDOM IMAGE
------------------------- */

function setRandomBackground() {

  const images =
    getCurrentImages();

  const randomIndex =
    Math.floor(
      Math.random() * images.length
    );

  const selectedImage =
    images[randomIndex];

  applyBackground(
    selectedImage
  );

  return selectedImage;

}

/* -------------------------
   7. PRELOAD ALL EXCEPT
      CURRENT IMAGE
------------------------- */

function preloadRemainingImages(
  currentImage
) {

  const allImages = [

    ...dayImages,

    ...nightImages

  ];

  allImages
    .filter(
      src => src !== currentImage
    )
    .forEach(src => {

      const img =
        new Image();

      img.src = src;

    });

}

/* -------------------------
   8. CACHE ALL IMAGES
------------------------- */

async function cacheImages() {

  if (!("caches" in window))
    return;

  try {

    const cache =
      await caches.open(
        "background-cache-v1"
      );

    const allImages = [

      ...dayImages,

      ...nightImages

    ];

    await Promise.all(

      allImages.map(
        async image => {

          try {

            await cache.add(
              image
            );

          } catch (err) {

            console.warn(
              "Cache failed:",
              image
            );

          }

        }
      )

    );

    console.log(
      "Background cache ready"
    );

  } catch (err) {

    console.error(
      "Cache error:",
      err
    );

  }

}

/* -------------------------
   9. INITIAL PAGE LOAD
------------------------- */

const currentImage =
  setRandomBackground();

/* -------------------------
   10. AFTER PAGE LOAD
------------------------- */

window.addEventListener(
  "load",
  () => {

    setTimeout(() => {

      preloadRemainingImages(
        currentImage
      );

      cacheImages();

    }, 200);

  }
);

/* -------------------------
   11. TOGGLE SWITCH
------------------------- */

toggle.addEventListener(
  "change",
  () => {

    isNight =
      toggle.checked;

    const currentImage =
      setRandomBackground();

    preloadRemainingImages(
      currentImage
    );

  }
);

</script>
    <script type="module">
import {supabase,getUser,logout} from "./shared/auth.js";
/* ─────────────────────────────
   1. REMOVE ACCESS TOKEN HASH
───────────────────────────── */

if (window.location.hash.includes("access_token")) {

  // let Supabase store session
  await supabase.auth.getSession();

  // clean URL
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}

/* ─────────────────────────────
   2. WAIT FOR SESSION RESTORE
───────────────────────────── */

await new Promise(resolve =>
  setTimeout(resolve, 1000)
);

/* ─────────────────────────────
   3. GET SESSION
───────────────────────────── */

const {
  data: { session }
} = await supabase.auth.getSession();

/* ─────────────────────────────
   4. REDIRECT IF NOT LOGGED IN
───────────────────────────── */

if (!session) {

  const isLocal =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1";

  window.location.href = isLocal
    ? "/home/login.html"
    : "https://joelofthesharingan.github.io/home/login.html";
}

/* ─────────────────────────────
   5. GET USER
───────────────────────────── */

const {
  data: { user }
} = await supabase.auth.getUser();

console.log(user);

/* ─────────────────────────────
   6. USERNAME
───────────────────────────── */

document.getElementById("username").textContent =

  user?.user_metadata?.full_name ||
  user?.user_metadata?.name ||
  user?.email ||
  "User";

/* ─────────────────────────────
   7. AVATAR
───────────────────────────── */

const avatar =
  document.getElementById("userAvatar");

avatar.src =

  user?.user_metadata?.avatar_url ||
  "images/default-avatar.png";

avatar.alt = "User Avatar";

avatar.onerror = () => {

  avatar.src =
    "images/default-avatar.png";
};

/* ─────────────────────────────
   8. LOGOUT
───────────────────────────── */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await logout();

    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    window.location.href = isLocal
      ? "/home/login.html"
      : "https://joelofthesharingan.github.io/home/login.html";
  });

</script>
