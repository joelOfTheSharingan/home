<html>
  <head>
    <style>/* ===== Global reset ===== */
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #2c2f36, #0f1115);
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ===== Title ===== */
h1 {
  position: absolute;
  top: 20px;
  color: #e6e6e6;
  letter-spacing: 2px;
  font-weight: 600;
}

/* ===== Calculator body ===== */
#display {
  width: 620px;
  padding: 24px;
  background: linear-gradient(145deg, #1e2229, #14171c);
  border-radius: 18px;
  box-shadow:
    0 25px 60px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

/* ===== Screen ===== */
#result {
  width: 100%;
  height: 110px;
  background: linear-gradient(180deg, #0c0f14, #06080c);
  border-radius: 14px;
  color: #00ff9c;
  font-size: 34px;
  font-weight: 500;
  padding: 18px;
  text-align: right;
  overflow-x: auto;
  box-shadow:
    inset 0 0 12px rgba(0, 255, 156, 0.15),
    inset 0 0 2px rgba(255, 255, 255, 0.1);
  margin-bottom: 24px;
}

/* ===== Keyboard grid ===== */
#keyboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

/* ===== Keys ===== */
.keys {
  height: 56px;
  background: linear-gradient(145deg, #2a2f38, #20242c);
  border-radius: 12px;
  border: none;
  color: #f2f2f2;
  font-size: 18px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow:
    0 6px 14px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition:
    transform 0.08s ease,
    box-shadow 0.08s ease,
    background 0.15s ease;
}

/* ===== Hover ===== */
.keys:hover {
  background: linear-gradient(145deg, #343a45, #262b34);
}

/* ===== Active press ===== */
.keys:active {
  transform: translateY(2px);
  box-shadow:
    0 3px 6px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

/* ===== Operators ===== */
.keys:nth-child(4n) {
  background: linear-gradient(145deg, #3b3f46, #2d3036);
  color: #ffd369;
}

/* ===== AC & Del ===== */
.keys[onclick*="AC"],
.keys[onclick*="Del"] {
  background: linear-gradient(145deg, #7a2d2d, #5a1f1f);
  color: #ffb3b3;
}

.keys[onclick*="AC"]:hover,
.keys[onclick*="Del"]:hover {
  background: linear-gradient(145deg, #903838, #6b2525);
}

/* ===== Equals ===== */
.keys:last-child {
  background: linear-gradient(145deg, #00c97a, #009e60);
  color: #02140d;
  font-size: 22px;
  font-weight: 700;
}

.keys:last-child:hover {
  background: linear-gradient(145deg, #00e88e, #00b86f);
}

/* ===== Sup styling ===== */
.keys sup {
  font-size: 0.7em;
  margin-left: 2px;
}
    </style>
  </head>
<body>
  <h1>Calculator</h1>
  <div id="display">
    <div id="result"></div>
  <div id="keyboard">
   <div class="keys" onclick="display('1')">1</div>
   <div class="keys" onclick="display('2')">2</div>
   <div class="keys" onclick="display('3')">3</div>
   <div class="keys" onclick="display('+')">+</div>
   <div class="keys" onclick="display('4')">4</div>
   <div class="keys" onclick="display('5')">5</div>
   <div class="keys" onclick="display('6')">6</div>
   <div class="keys" onclick="display('-')">-</div>
   <div class="keys" onclick="display('7')">7</div>
   <div class="keys" onclick="display('8')">8</div>
   <div class="keys" onclick="display('9')">9</div>
   <div class="keys" onclick="display('*')">*</div>
   <div class="keys" onclick="display('0')">0</div>
   <div class="keys" onclick="display('sqrt')">sqrt</div>
   <div class="keys" onclick="display('raised')">n<sup>x</sup></div>
   <div class="keys" onclick="display('/')">/</div>
   <div class="keys" onclick="display('Del')">Del</div>
   <div class="keys" onclick="display('AC')">AC</div>
   <div class="keys" onclick="display('.')">.</div>
   <div class="keys" onclick="solve()">=</div>
  </div></div>
</body>
<script>
  let screen=""
  function display(value){
    const result = document.getElementById("result")
    if (value === "AC"){
      result.innerHTML = ""
      screen=""
    } else if (value === "Del"){
      result.innerHTML = result.innerHTML.slice(0,-1)
      screen=screen.slice(0,-1)
    } else {
      result.innerHTML += value
      screen+=value
    }
    //console.log(screen)
  }
  function solve(){
   if(screen.includes("sqrt")){
    screen=replaceSqrt(screen)
    
  }
   if(screen.includes("raised")){
    screen=screen.replace("raised","**")
   }

    if(typeof Number(screen[screen.length-1])==="number"){
const result = document.getElementById("result")
    result.innerHTML = Number(eval(screen).toFixed(Number(5)))
    }else{
alert("Invalid Input")
    }
   }
    function replaceSqrt(s){
  let s1=s
  let n=""
    let Index = s.indexOf("sqrt")
       s=s.slice(Index+4)
       //console.log(s)
    for(let i=0;i<s.length;i++){
      //console.log(s,i,s[i],Number(s[i]),isNaN(Number(s[i])))
      if(isNaN(Number(s[i]))==false||s[i]=="."){
        //console.log(Number(s[i]))
        n+=s[i]
        //console.log(n)
      }else{
        break
      }
    }
    s=s1.replace("sqrt"+n,Math.sqrt(n))
   return s
  }
</script>
</html>
